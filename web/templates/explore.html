<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#967BB6">
  <title>Explore — aMusicServer</title>
  <link rel="stylesheet" href="/static/explore.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Explore</h1>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="explore">Explore</button>
        <button class="tab-btn" data-tab="import">Import Share</button>
      </nav>
    </header>

    <!-- Explore Tab (unified search) -->
    <section id="tab-explore" class="tab-panel active">
      <div class="search-bar">
        <input type="text" id="search-query"
               placeholder="Search or paste a URL (SoundCloud, Spotify, YouTube)…">
        <button id="search-go">Go</button>
      </div>
      <p id="search-hint" class="search-hint"></p>
      <ul id="result-users" class="user-list"></ul>
    </section>

    <!-- Import Share Tab -->
    <section id="tab-import" class="tab-panel" style="display:none">
      <textarea id="import-paste" rows="8"
                placeholder="Paste a share link or PLAYLIST: text block here…"></textarea>
      <button id="import-parse">Parse</button>
      <ul id="import-track-list" class="track-list"></ul>
    </section>

    <!-- Track list (shared across tabs) -->
    <div id="track-list-wrapper">
      <ul id="main-track-list" class="track-list"></ul>
    </div>

    <!-- Persistent audio player -->
    <div id="player-bar">
      <audio id="player" controls></audio>
      <span id="player-label">No track selected</span>
    </div>

    <!-- Save bar -->
    <div id="save-bar">
      <span id="selected-count">0 selected</span>
      <input type="text" id="playlist-name" placeholder="Playlist name">
      <div class="save-actions">
        <button id="save-selected">Save Selected</button>
        <button id="save-all">Save All</button>
        <button id="share-playlist-btn">Share</button>
      </div>
    </div>
  </div>
  <script src="/static/explore.js"></script>
  <script>
    window.SERVER_HOSTNAME = "{{ hostname }}";
    window.SERVER_PORT = {{ port }};
  </script>
</body>
</html>
