<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#967BB6">
  <title>Explore — aMusicServer</title>
  <link rel="stylesheet" href="/static/explore.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Explore</h1>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="explore">Explore</button>
        <button class="tab-btn" data-tab="import">Import Share</button>
        <button class="tab-btn" data-tab="discover">Discover</button>
      </nav>
    </header>

    <!-- Explore Tab (unified search) -->
    <section id="tab-explore" class="tab-panel active">
      <div class="search-bar">
        <input type="text" id="search-query"
               placeholder="Search or paste a URL (SoundCloud, Spotify, YouTube)…">
        <button id="search-go">Go</button>
      </div>
      <p id="search-hint" class="search-hint"></p>
      <ul id="result-users" class="user-list"></ul>
    </section>

    <!-- Import Share Tab -->
    <section id="tab-import" class="tab-panel" style="display:none">
      <textarea id="import-paste" rows="8"
                placeholder="Paste a share link or PLAYLIST: text block here…"></textarea>
      <button id="import-parse">Parse</button>
      <ul id="import-track-list" class="track-list"></ul>
    </section>

    <!-- Discover Tab -->
    <section id="tab-discover" class="tab-panel" style="display:none">
      <div class="discover-settings">
        <h2>Discover Settings</h2>

        <div class="setting-group">
          <label for="dc-weekly-count">Tracks per run</label>
          <input type="number" id="dc-weekly-count" min="1" max="200" value="30">
        </div>

        <div class="setting-group">
          <label for="dc-per-artist">Tracks per artist</label>
          <input type="number" id="dc-per-artist" min="1" max="5" value="1">
        </div>

        <div class="setting-group">
          <label for="dc-schedule">Schedule</label>
          <select id="dc-schedule">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
        </div>

        <div class="setting-group" id="dc-runday-row">
          <label for="dc-run-day">Run day</label>
          <select id="dc-run-day">
            <option value="monday">Monday</option>
            <option value="tuesday">Tuesday</option>
            <option value="wednesday">Wednesday</option>
            <option value="thursday">Thursday</option>
            <option value="friday">Friday</option>
            <option value="saturday">Saturday</option>
            <option value="sunday">Sunday</option>
          </select>
        </div>

        <div class="setting-group">
          <label for="dc-run-hour">Run hour (0–23)</label>
          <input type="number" id="dc-run-hour" min="0" max="23" value="22">
        </div>

        <div class="setting-group">
          <label>Last.fm seed periods</label>
          <div class="period-checkboxes">
            <label><input type="checkbox" name="lfm-period" value="7day"> 7 days</label>
            <label><input type="checkbox" name="lfm-period" value="1month" checked> 1 month</label>
            <label><input type="checkbox" name="lfm-period" value="3month"> 3 months</label>
            <label><input type="checkbox" name="lfm-period" value="6month"> 6 months</label>
            <label><input type="checkbox" name="lfm-period" value="overall" checked> Overall</label>
          </div>
        </div>

        <div class="setting-group">
          <label for="dc-playlist-cap">Playlist size cap</label>
          <input type="number" id="dc-playlist-cap" min="10" max="500" value="100">
        </div>

        <div class="setting-group">
          <label for="dc-ttl">Suggestion memory (days)</label>
          <input type="number" id="dc-ttl" min="1" max="365" value="90">
        </div>

        <div class="discover-actions">
          <button id="dc-save">Save</button>
          <button id="dc-run">Run now</button>
          <span id="dc-status"></span>
        </div>
      </div>
    </section>

    <!-- Track list (shared across tabs) -->
    <div id="track-list-wrapper">
      <ul id="main-track-list" class="track-list"></ul>
    </div>

    <!-- Persistent audio player -->
    <div id="player-bar">
      <audio id="player" controls></audio>
      <span id="player-label">No track selected</span>
    </div>

    <!-- Save bar -->
    <div id="save-bar">
      <span id="selected-count">0 selected</span>
      <input type="text" id="playlist-name" placeholder="Playlist name">
      <div class="save-actions">
        <button id="save-selected">Save Selected</button>
        <button id="save-all">Save All</button>
        <button id="share-playlist-btn">Share</button>
      </div>
    </div>
  </div>
  <script src="/static/explore.js"></script>
  <script>
    window.SERVER_HOSTNAME = "{{ hostname }}";
    window.SERVER_PORT = {{ port }};
  </script>
</body>
</html>
