name: Build Windows installer

# Triggers:
#   - push of a v*.*.* tag           → builds + publishes to both forges
#   - manual run from the Actions UI → so we can build v1.0.1 (whose tag was
#     pushed before this workflow existed) by dispatching against that tag
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write    # required by softprops/action-gh-release to attach assets

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        working-directory: windows
        run: build.bat

      - name: Locate built installer
        id: artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem windows\Output\Setup_aMusicServer_*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "no installer produced in windows\Output\"; exit 1 }
          "path=$($exe.FullName)"      | Out-File -Append $env:GITHUB_OUTPUT
          "name=$($exe.Name)"          | Out-File -Append $env:GITHUB_OUTPUT
          "tag=$($env:GITHUB_REF_NAME)"| Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Built: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.artifact.outputs.tag }}
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload to Codeberg release
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_CI }}
          TAG:       ${{ steps.artifact.outputs.tag }}
          ASSETNAME: ${{ steps.artifact.outputs.name }}
          FILEPATH:  ${{ steps.artifact.outputs.path }}
          CB_REPO:   "Lycka/musicServerTemplate"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CODEBERG_TOKEN:-}" ]; then
            echo "::warning::CODEBERG_CI secret is not set — skipping Codeberg upload."
            echo "::warning::Create one at https://codeberg.org/user/settings/applications"
            echo "::warning::and add it as a repo secret named CODEBERG_CI."
            exit 0
          fi
          API="https://codeberg.org/api/v1"
          AUTH="Authorization: token $CODEBERG_TOKEN"
          BODY=/tmp/cb-resp.json

          # Sanity check: token is valid and we can read our own user info.
          echo "→ verifying token can read /user…"
          status=$(curl -sS -o "$BODY" -w '%{http_code}' -H "$AUTH" "$API/user")
          echo "   HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Codeberg auth failed (HTTP $status). Response body:"
            cat "$BODY"; echo
            echo "::error::Check the CODEBERG_CI token: it must be a valid Codeberg API token."
            exit 1
          fi
          user=$(jq -r '.login // "?"' < "$BODY")
          echo "   authenticated as $user"

          # Sanity check: tag must exist on the Codeberg repo.
          echo "→ verifying tag $TAG exists on $CB_REPO…"
          status=$(curl -sS -o "$BODY" -w '%{http_code}' -H "$AUTH" "$API/repos/$CB_REPO/tags/$TAG")
          echo "   HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Codeberg tag lookup failed (HTTP $status). Response body:"
            cat "$BODY"; echo
            echo "::error::The tag $TAG must be pushed to $CB_REPO before the workflow runs."
            exit 1
          fi

          # Look up release for tag.
          echo "→ looking up Codeberg release for $TAG…"
          status=$(curl -sS -o "$BODY" -w '%{http_code}' -H "$AUTH" "$API/repos/$CB_REPO/releases/tags/$TAG")
          echo "   HTTP $status"
          release_id=""
          if [ "$status" = "200" ]; then
            release_id=$(jq -r '.id // empty' < "$BODY")
            echo "   found release id=$release_id"
          elif [ "$status" = "404" ]; then
            echo "   no release yet — will create"
          else
            echo "::error::Codeberg release lookup returned HTTP $status. Body:"
            cat "$BODY"; echo
            exit 1
          fi

          # Create release if missing.
          if [ -z "$release_id" ]; then
            echo "→ creating Codeberg release $TAG…"
            payload=$(jq -nc --arg t "$TAG" '{tag_name:$t, name:$t, body:"Automated release of \($t)", draft:false, prerelease:false}')
            status=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST -H "$AUTH" \
              -H "Content-Type: application/json" -d "$payload" \
              "$API/repos/$CB_REPO/releases")
            echo "   HTTP $status"
            if [ "$status" != "201" ] && [ "$status" != "200" ]; then
              echo "::error::Codeberg release creation failed (HTTP $status). Body:"
              cat "$BODY"; echo
              echo "::error::Likely the CODEBERG_CI token lacks write:repository scope."
              echo "::error::Regenerate the token at codeberg.org/user/settings/applications"
              echo "::error::with the 'write:repository' scope ticked."
              exit 1
            fi
            release_id=$(jq -r '.id // empty' < "$BODY")
            if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
              echo "::error::Codeberg release was created but no id returned. Body:"
              cat "$BODY"; echo
              exit 1
            fi
            echo "   created id=$release_id"
          fi

          # Idempotency: drop any existing asset with the same filename.
          echo "→ checking for an existing asset named $ASSETNAME…"
          curl -sS -o "$BODY" -H "$AUTH" "$API/repos/$CB_REPO/releases/$release_id/assets" >/dev/null
          asset_id=$(jq -r ".[]? | select(.name==\"$ASSETNAME\") | .id" < "$BODY" | head -1)
          if [ -n "$asset_id" ]; then
            echo "   replacing existing asset id=$asset_id"
            curl -sS -X DELETE -H "$AUTH" \
              "$API/repos/$CB_REPO/releases/$release_id/assets/$asset_id" > /dev/null
          fi

          # Upload.
          echo "→ uploading $ASSETNAME ($(du -h "$FILEPATH" | cut -f1)) to release $TAG…"
          status=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST -H "$AUTH" \
            -F "attachment=@$FILEPATH" \
            "$API/repos/$CB_REPO/releases/$release_id/assets?name=$ASSETNAME")
          echo "   HTTP $status"
          if [ "$status" != "201" ] && [ "$status" != "200" ]; then
            echo "::error::Codeberg asset upload failed (HTTP $status). Body:"
            cat "$BODY"; echo
            exit 1
          fi
          echo "✓ Codeberg release populated."
